<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jyothika - My Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe0ec, #e0f2ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #e91e63;
            font-size: 40px;
            margin-bottom: 15px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
            margin: 10px 0;
        }

        .highlight {
            color: #e91e63;
            font-weight: bold;
        }

        .food {
            font-size: 50px;
            margin: 20px 0;
        }

        .card {
            background: #fff0f5;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        footer {
            margin-top: 25px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="food">🍕 🍔 🍜</div>

        <h1>Hi, I'm Jyothika!</h1>

        <h2>2nd Year Engineering Student</h2>

        <div class="card">
            <p>🎓 I am currently studying <span class="highlight">2nd Year Engineering</span> at JIT.</p>
            <p>🍴 I absolutely <span class="highlight">love eating!</span></p>
            <p>😊 Welcome to my little profile page!</p>
        </div>

        <footer>
            Made with ❤️ by Jyothika
        </footer>
    </div>

</body>
</html>
